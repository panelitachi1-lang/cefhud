<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Notification</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .state-ui {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .state-ui__back-hint {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 1.2962962963vh;
      left: 4.6296296296vh;
      bottom: 4.6296296296vh;
    }
    .state-ui__back-hint__button {
      padding: .8333333333vh 1.8518518519vh;
      background: #fff6eb1a;
      border: 1px solid rgba(255, 246, 235, .15);
      border-radius: .3703703704vh;
      color: #fff6ebf2;
      transition: all .2s;
      font-family: 'Gotham Pro', 'Proxima Nova', sans-serif;
      font-size: 1.4814814815vh;
      line-height: 1.4em;
      font-weight: 700;
      color: #979797;
    }
    .state-ui__back-hint__text {
      font-family: 'Gotham Pro', 'Proxima Nova', sans-serif;
      line-height: 1.6666666667vh;
      font-size: 1.7592592593vh;
      font-weight: 400;
      letter-spacing: .02em;
      color: #979797;
      max-width: 16.6666666667vh;
      transition: color .15s;
    }
    .state-ui__back-hint:hover .state-ui__back-hint__button {
      background: #fff6eb26;
      color: #fff6eb;
    }
    .state-ui__back-hint:hover .state-ui__back-hint__text {
      color: #a6a6a6;
    }
    .system-notification {
      position: fixed;
      inset: 0;
      z-index: 10000;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
      animation: hostSlideAnimation 250ms ease-in-out;
    }
    @keyframes hostSlideAnimation {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .app-connecting, .app-server-is-full, .app-support, .app-restart, .app-disconnected, .app-disconnected-by-restart {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: min(1.3888888889vh, .78125vw);
      position: absolute;
      left: 0;
      right: 0;
      top: min(4.6296296296vh, 2.6041666667vw);
      margin-inline: auto;
      width: fit-content;
      box-shadow: 0 0 min(2.7777777778vh, 1.5625vw) min(.9259259259vh, .5208333333vw) #0003;
      overflow: hidden;
      animation: pulse 2s infinite linear;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: .8; }
      to { opacity: 1; }
    }
    .app-connecting {
      padding: min(2.3148148148vh, 1.3020833333vw);
      border: min(.1851851852vh, .1041666667vw) solid transparent;
      -webkit-border-image: linear-gradient(100deg, #4479FF 0%, #87A9FF 100%);
      border-image-slice: 1;
      background: linear-gradient(100deg, #143fab, #3770ff);
      background-origin: border-box;
    }
    .app-disconnected {
      gap: min(.9259259259vh, .5208333333vw);
      height: min(6.9444444444vh, 3.90625vw);
      padding: 0 min(.9259259259vh, .5208333333vw);
      border: min(.1851851852vh, .1041666667vw) solid #FF6060;
      background: linear-gradient(100deg, #9b0404, #e31b1b);
      pointer-events: auto;
    }
    .app-disconnected-by-restart {
      padding: min(2.3148148148vh, 1.3020833333vw);
      border: min(.1851851852vh, .1041666667vw) solid transparent;
      -webkit-border-image: linear-gradient(90deg, rgb(255, 199, 155) 0%, rgb(232, 147, 255) 50%, rgb(174, 255, 247) 100%);
      border-image-slice: 1;
      background: linear-gradient(90deg, #ff7400, #b500e7, #00ffe1);
      background-origin: border-box;
    }
    .app-restart {
      gap: min(1.8518518519vh, 1.0416666667vw);
      height: min(6.9444444444vh, 3.90625vw);
      padding: 0 min(2.3148148148vh, 1.3020833333vw);
      border: min(.1851851852vh, .1041666667vw) solid #ffd260;
      background: linear-gradient(100deg, #cf9816, #e3b41b);
    }
    .app-server-is-full .wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: min(1.3888888889vh, .78125vw);
      width: fit-content;
      min-width: min(60.1851851852vh, 33.8541666667vw);
      padding: min(2.3148148148vh, 1.3020833333vw);
      border: min(.1851851852vh, .1041666667vw) solid #7CBC54;
      background: linear-gradient(100deg, #56942f, #2a6f00);
    }
    .app-server-is-full .wrapper.priority {
      border: min(.1851851852vh, .1041666667vw) solid #dcdddd;
      background: linear-gradient(100deg, #f169f6, #57b8fd);
    }
    .app-support {
      gap: min(1.8518518519vh, 1.0416666667vw);
      height: min(6.9444444444vh, 3.90625vw);
      padding: 0 min(.9259259259vh, .5208333333vw);
      border: min(.1851851852vh, .1041666667vw) solid #f6885a;
      background: linear-gradient(100deg, #d15822, #f48334);
      pointer-events: auto;
    }
    .mat-icon {
      color: #fff;
      width: min(1.8518518519vh, 1.0416666667vw);
      height: min(1.8518518519vh, 1.0416666667vw);
      font-size: min(1.8518518519vh, 1.0416666667vw);
      line-height: min(1.8518518519vh, 1.0416666667vw);
    }
    .app-disconnected .button, .app-support .button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: min(1.2037037037vh, .6770833333vw);
      padding: min(1.3888888889vh, .78125vw);
      z-index: 3;
      transition: all .25s linear;
      pointer-events: auto;
    }
    .app-disconnected .button:hover, .app-support .button:hover {
      transform: scale(1.05);
    }
    .app-disconnected .button {
      background: #1f1f1f;
    }
    .app-support .button {
      background: #fff;
    }
    .app-support .button .mat-icon {
      color: #919ca8;
    }
    .app-support .button .mat-icon.arrow {
      color: #000;
      width: min(1.2037037037vh, .6770833333vw);
      height: min(1.2037037037vh, .6770833333vw);
      font-size: min(1.2037037037vh, .6770833333vw);
      line-height: min(1.2037037037vh, .6770833333vw);
    }
    .app-server-is-full .wrapper .divider {
      width: min(.1851851852vh, .1041666667vw);
      height: min(2.7777777778vh, 1.5625vw);
      background: #fff3;
    }
    .app-restart .text {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: min(.462962963vh, .2604166667vw);
    }
    .app-restart .text .time {
      text-align: center;
      padding: min(.1851851852vh, .1041666667vw) min(.9259259259vh, .5208333333vw);
      width: min(4.6296296296vh, 2.6041666667vw);
      border-radius: min(.2777777778vh, .15625vw);
      background: #1f1f1f;
    }
    span {
      font-family: 'Proxima Nova', sans-serif;
      font-weight: 700;
      font-size: min(1.6666666667vh, .9375vw);
      line-height: 1.3em;
      letter-spacing: 0;
      color: #fff;
    }
    .app-disconnected .button span, .app-support .button span {
      font-family: 'Proxima Nova', sans-serif;
      font-weight: 800;
      font-size: min(1.6666666667vh, .9375vw);
      line-height: 1.3em;
      letter-spacing: 0;
      color: #fff;
    }
    .app-support .button span {
      color: #000;
    }
    .background {
      position: absolute;
      left: 0;
      top: 0;
      width: min(46.2962962963vh, 26.0416666667vw);
      height: min(8.3333333333vh, 4.6875vw);
      background-image: url(/assets/images/backgrounds/system-notification.png);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100%;
    }
  </style>
</head>
<body>
  <div class="system-notification"></div>
  <script>
    const NotificationTypes = {
      CONNECTING: 0,
      SERVER_IS_FULL: 1,
      SUPPORT: 2,
      RESTARTING: 3,
      DISCONNECTED: 4,
      DISCONNECTED_BY_RESTART: 5,
      0: "CONNECTING",
      1: "SERVER_IS_FULL",
      2: "SUPPORT",
      3: "RESTARTING",
      4: "DISCONNECTED",
      5: "DISCONNECTED_BY_RESTART"
    };

    const ActionTypes = {
      SUPPORT: 0,
      RECONNECT: 1,
      0: "SUPPORT",
      1: "RECONNECT"
    };

    // Simulated SystemNotificationService
    class SystemNotificationService {
      constructor() {
        this.state = null; // Начальное состояние явно null
        this.listeners = {
          show: [],
          hide: [],
          response: []
        };
      }

      on(event, callback) {
        if (event === 'SYSTEM_NOTIFICATION_SHOW') {
          this.listeners.show.push(callback);
        } else if (event === 'SYSTEM_NOTIFICATION_HIDE') {
          this.listeners.hide.push(callback);
        } else if (event === 'SYSTEM_NOTIFICATION_RESPONSE') {
          this.listeners.response.push(callback);
        }
      }

      show(state) {
        if (this.state?.type !== state.type) {
          this.state = null;
          this.listeners.hide.forEach(cb => cb());
          setTimeout(() => {
            this.state = state;
            this.listeners.show.forEach(cb => cb(state));
          }, 1);
        } else {
          this.state = state;
          this.listeners.show.forEach(cb => cb(state));
        }
      }

      hide() {
        this.state = null;
        this.listeners.hide.forEach(cb => cb());
      }

      sendSupportTrigger() {
        this.trigger({ key: ActionTypes.SUPPORT, data: null });
      }

      sendReconnectTrigger() {
        this.trigger({ key: ActionTypes.RECONNECT, data: null });
      }

      trigger(event, data) {
        this.listeners.response.forEach(cb => cb(data));
      }

      getState() {
        return this.state;
      }
    }

    // Utility to format time (mm:ss)
    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // System Notification Component
    class SystemNotification {
      constructor() {
        this.service = new SystemNotificationService();
        this.container = document.querySelector('.system-notification');
        this.state = this.service.getState(); // Ожидаем, что state === null

        // Проверяем, что начальное состояние null, но не выбрасываем ошибку
        // if (!this.state) {
        //   throw new Error('systemNotificationService должен быть null при создании компонента');
        // }

        // Subscribe to service events
        this.service.on('SYSTEM_NOTIFICATION_SHOW', (state) => {
          this.state = state;
          this.render();
        });

        this.service.on('SYSTEM_NOTIFICATION_HIDE', () => {
          this.state = null;
          this.render();
        });

        this.service.on('SYSTEM_NOTIFICATION_RESPONSE', (data) => {
          console.log('Response triggered:', data);
        });

        // Рендерим начальное состояние (ничего, так как state === null)
        this.render();

      }

      render() {
        this.container.innerHTML = '';
        if (!this.state) return; // Если состояние null, ничего не рендерим

        const type = this.state.type;
        const data = this.state.data;

        if (type === NotificationTypes.CONNECTING) {
          this.renderConnecting(data);
        } else if (type === NotificationTypes.SERVER_IS_FULL) {
          this.renderServerIsFull(data);
        } else if (type === NotificationTypes.SUPPORT) {
          this.renderSupport(data);
        } else if (type === NotificationTypes.RESTARTING) {
          this.renderRestart(data);
        } else if (type === NotificationTypes.DISCONNECTED) {
          this.renderDisconnected(data);
        } else if (type === NotificationTypes.DISCONNECTED_BY_RESTART) {
          this.renderDisconnectedByRestart(data);
        }
      }

      renderConnecting(data) {
        const div = document.createElement('div');
        div.className = 'app-connecting';
        div.innerHTML = `
          <i class="mat-icon fas fa-info-circle"></i>
          <span>${data.text}</span>
          <div class="background"></div>
        `;
        this.container.appendChild(div);
      }

      renderServerIsFull(data) {
        const div = document.createElement('div');
        div.className = 'app-server-is-full';
        div.innerHTML = `
          <div class="wrapper${data.priority ? ' priority' : ''}">
            <i class="mat-icon fas fa-info-circle"></i>
            <span>${data.text}</span>
            <div class="divider"></div>
            <span>Ваша позиция: ${data.position} из ${data.queueSize}</span>
            <div class="background"></div>
          </div>
        `;
        this.container.appendChild(div);
      }

      renderSupport(data) {
        const div = document.createElement('div');
        div.className = 'app-support';
        div.innerHTML = `
          <i class="mat-icon fas fa-info-circle"></i>
          <span>${data.text}</span>
          <div class="button">
            <i class="mat-icon fas fa-vk"></i>
            <span>AMAZING SUPPORT</span>
            <i class="mat-icon arrow fas fa-arrow-up-right-from-square"></i>
          </div>
          <div class="background"></div>
        `;
        div.querySelector('.button').addEventListener('click', () => {
          this.service.sendSupportTrigger();
        });
        this.container.appendChild(div);
      }

      renderRestart(data) {
        const div = document.createElement('div');
        div.className = 'app-restart';
        div.innerHTML = `
          <i class="mat-icon fas fa-info-circle"></i>
          <div class="text">
            <span>Внимание! Через</span>
            <span class="time">${formatTime(data.time)}</span>
            <span>произойдет технический рестарт</span>
          </div>
          <div class="background"></div>
        `;
        this.container.appendChild(div);
      }

      renderDisconnected(data) {
        const div = document.createElement('div');
        div.className = 'app-disconnected';
        div.innerHTML = `
          <i class="mat-icon fas fa-info-circle"></i>
          <span>${data.text}</span>
          <div class="button">
            <span>ПЕРЕПОДКЛЮЧИТЬСЯ</span>
            <i class="mat-icon fas fa-sync-alt"></i>
          </div>
          <div class="background"></div>
        `;
        div.querySelector('.button').addEventListener('click', () => {
          this.service.sendReconnectTrigger();
        });
        this.container.appendChild(div);
      }

      renderDisconnectedByRestart(data) {
        const div = document.createElement('div');
        div.className = 'app-disconnected-by-restart';
        div.innerHTML = `
          <i class="mat-icon fas fa-info-circle"></i>
          <span>${data.text}</span>
          <div class="background"></div>
        `;
        this.container.appendChild(div);
      }

      test() {
        this.service.show({
          type: NotificationTypes.CONNECTING,
          data: { text: 'Подключение к серверу' }
        });
      }
    }

    // Initialize
    const systemNotification = new SystemNotification();
  </script>
</body>
</html>
