<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Proxima Nova Bold';
    src: url('css/fonts/ProximaNova-Bold.ttf') format('truetype');
    font-weight: bold;
  }
  @font-face {
    font-family: 'Gotham-Medium';
    src: url('css/fonts/Gotham Pro Medium.ttf');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Proxima Nova Bold', sans-serif;
    overflow: hidden;
  }
  .dialog {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(to bottom right, #1a1a1c, #201f24);
    border: 1px solid #444;
    border-radius: 5px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    min-width: 500px;
    max-width: 820px;
    z-index: 1000;
    color: #fff;
    user-select: none;
    overflow: hidden;
  }
  .dialog::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(to bottom, rgba(26,26,28,0.6) 0%, rgba(32,31,36,0.1) 100%),
      url('background.png');
    z-index: -1;
  }
  .dialog-header {
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dialog-header::after {
    content: "";
    flex-grow: 1;
    height: 1px;
    background: linear-gradient(to right, rgba(255,255,255,0.25), rgba(255,255,255,0));
    align-self: center;
    display: block;
    margin-top: 10px;
    margin-left: 5px;
  }
  .dialog-title {
    font-family: 'Gotham-Medium', sans-serif;
    font-weight: bold;
    font-size: 22px;
    color: #e69348;
    text-transform: uppercase;
    margin-top: 10px;
    letter-spacing: 0.155vh;
  }
  .dialog-content {
    padding: 0 20px 10px;
    max-height: 420px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #e69348 transparent;
    margin-top: -5px;
  }
  .dialog-content::-webkit-scrollbar { width: 4px; }
  .dialog-content::-webkit-scrollbar-thumb { background: #e69348; border-radius: 2px; }
  .dialog-list { display: flex; flex-direction: column; gap: 3px; }
  .dialog-list-item {
    padding: 11px 14px;
    cursor: pointer;
    border-radius: 2px;
    background: rgba(0,0,0,0.5);
    font-family: 'Proxima Nova Bold', sans-serif;
    font-size: 15px;
    transition: background 0.15s;
    line-height: 1.4;
  }
  .dialog-list-item:hover { background: rgba(255,255,255,0.07); }
  .dialog-list-item.selected {
    background: #e69348;
    color: #1a1a1c;
    box-shadow: 0 0 5px rgba(230,147,72,0.5);
  }
  .item-label {
    font-family: 'Gotham-Medium', sans-serif;
    font-size: 13px;
    color: #e69348;
    margin-right: 5px;
  }
  .dialog-list-item.selected .item-label { color: #1a1a1c; }
  .item-text { color: #fff; }
  .dialog-list-item.selected .item-text { color: #1a1a1c; }
  .dialog-buttons {
    display: flex;
    justify-content: space-between;
    padding: 10px 20px;
    gap: 8px;
  }
  .dialog-button {
    padding: 12px 15px;
    border: none;
    border-radius: 1.5px;
    cursor: pointer;
    font-size: 12px;
    flex: 1;
    text-transform: uppercase;
    font-family: 'Proxima Nova Bold', sans-serif;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 10px;
  }
  .dialog-button:active { transform: scale(0.98); }
  .btn-primary {
    background-image: linear-gradient(to right, #21a24d, #5fda55);
    color: #fff;
    box-shadow: 0 1.5px 0 #2d682f;
    margin-right: 5px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary {
    background: #3f3f41;
    color: rgba(255,255,255,0.7);
    opacity: 0.7;
    outline: 0.1px solid rgba(255,255,255,0.3);
    margin-left: 5px;
  }
  .btn-secondary:hover { opacity: 0.9; }
</style>
</head>

  var dialogBtns  = document.getElementById('dialogButtons');

  function formatMoney(n) {
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function renderButtons(lbl1, fn1, lbl2, fn2) {
    dialogBtns.innerHTML = '';
    var b1 = document.createElement('button');
    b1.className = 'dialog-button btn-primary';
    b1.textContent = lbl1;
    b1.onclick = fn1;
    var b2 = document.createElement('button');
    b2.className = 'dialog-button btn-secondary';
    b2.textContent = lbl2;
    b2.onclick = fn2;
    dialogBtns.appendChild(b1);
    dialogBtns.appendChild(b2);
  }

  function showChapters() {
    state.screen = 'chapters';
    state.selectedIndex = 0;
    dialogTitle.textContent = 'ВЫБЕРИТЕ ГЛАВУ КОАП';
    renderChapterList();
    renderButtons('Далее', function() {
      state.selectedChapter = CHAPTERS[state.selectedIndex];
      showArticles();
    }, 'Закрыть', function() {
      if (typeof cef !== 'undefined') cef.emit('ticket:close');
    });
  }

  function renderChapterList() {
    dialogList.innerHTML = '';
    CHAPTERS.forEach(function(ch, i) {
      var item = document.createElement('div');
      item.className = 'dialog-list-item' + (i === state.selectedIndex ? ' selected' : '');
      item.innerHTML = '<span class="item-text">' + ch.title + '</span>';
      item.onclick = function() { state.selectedIndex = i; renderChapterList(); };
      item.ondblclick = function() { state.selectedIndex = i; state.selectedChapter = ch; showArticles(); };
      dialogList.appendChild(item);
    });
  }

  function showArticles() {
    state.screen = 'articles';
    state.selectedIndex = 0;
    dialogTitle.textContent = 'ВЫБЕРИТЕ СТАТЬЮ';
    renderArticleList();
    renderButtons('Выписать', function() {
      var arts = ARTICLES[state.selectedChapter.id] || [];
      if (!arts[state.selectedIndex]) return;
      var art = arts[state.selectedIndex];
      if (art.f === 0) return;
      if (typeof cef !== 'undefined') {
        cef.emit('ticket:confirm', art.n, art.t, art.f);
      }
    }, 'Назад', showChapters);
  }

  function renderArticleList() {
    dialogList.innerHTML = '';
    var arts = ARTICLES[state.selectedChapter.id] || [];
    arts.forEach(function(art, i) {
      var item = document.createElement('div');
      item.className = 'dialog-list-item' + (i === state.selectedIndex ? ' selected' : '');
      item.innerHTML = '<span class="item-label">Ст.' + art.n + ' КоАП:</span>'
        + '<span class="item-text"> ' + art.t + '</span>'
        ;
      item.onclick = function() { state.selectedIndex = i; renderArticleList(); };
      item.ondblclick = function() {
        state.selectedIndex = i;
        var a = arts[i];
        if (a.f > 0 && typeof cef !== 'undefined') cef.emit('ticket:confirm', a.n, a.t, a.f);
      };
      dialogList.appendChild(item);
    });
  }

  document.addEventListener('keydown', function(e) {
    var len = state.screen === 'chapters' ? CHAPTERS.length : (ARTICLES[state.selectedChapter ? state.selectedChapter.id : 1] || []).length;
    if (e.keyCode === 38 && state.selectedIndex > 0) {
      state.selectedIndex--;
      state.screen === 'chapters' ? renderChapterList() : renderArticleList();
    } else if (e.keyCode === 40 && state.selectedIndex < len - 1) {
      state.selectedIndex++;
      state.screen === 'chapters' ? renderChapterList() : renderArticleList();
    } else if (e.keyCode === 27) {
      if (state.screen === 'articles') showChapters();
      else if (typeof cef !== 'undefined') cef.emit('ticket:close');
    }
  });

  if (typeof cef !== 'undefined') {
    cef.on('ticket:open', function(targetId, targetName) {
      state.targetId   = targetId;
      state.targetName = targetName;
      showChapters();
    });
  } else {
    // Тест без CEF
    state.targetId = 0;
    state.targetName = 'Matvei_Gordon';
    showChapters();
  }
</script>
</body>
</html>
