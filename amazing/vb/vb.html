<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Военный билет</title>
<style>
@font-face{font-family:'Proxima Nova Bold';src:url('../css/fonts/ProximaNova-Bold.ttf') format('truetype');}
@font-face{font-family:'Gotham-Medium';src:url('../css/fonts/Gotham Pro Medium.ttf') format('truetype');}
*{box-sizing:border-box;margin:0;padding:0;}
body{width:100vw;height:100vh;overflow:hidden;background:transparent;font-family:'Proxima Nova Bold',sans-serif;}
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(to bottom right,#1a1a1c,#201f24);border:1px solid #444;border-radius:5px;box-shadow:0 0 20px rgba(0,0,0,0.5);width:520px;z-index:1000;color:#fff;user-select:none;overflow:hidden;display:none;}
.dialog.active{display:block;}
.dialog::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(26,26,28,0.6) 0%,rgba(32,31,36,0.1) 100%),url('../images/background.svg');z-index:-1;}
.dialog-header{padding:16px 20px 12px;cursor:move;display:flex;align-items:center;}
.dialog-header::after{content:"";flex-grow:1;height:1px;background:linear-gradient(to right,rgba(255,255,255,0.25),rgba(255,255,255,0));align-self:center;margin-left:15px;}
.dialog-title{font-family:'Gotham-Medium',sans-serif;font-size:17px;color:#e69348;text-transform:uppercase;letter-spacing:0.12em;}
.dialog-content{padding:0 20px 10px;max-height:360px;overflow-y:auto;}
.dialog-content::-webkit-scrollbar{width:4px;}
.dialog-content::-webkit-scrollbar-thumb{background:#e69348;border-radius:2px;}
.dialog-buttons{display:flex;justify-content:space-between;padding:10px 20px 18px;gap:8px;margin-top:4px;}
.btn{padding:13px 10px;border:none;border-radius:2px;cursor:pointer;font-size:12px;text-transform:uppercase;font-family:'Proxima Nova Bold',sans-serif;letter-spacing:0.08em;flex:1;transition:opacity 0.2s,box-shadow 0.2s;}
.btn-primary{background:linear-gradient(to right,#21a24d,#5fda55);color:#fff;box-shadow:0 2px 0 #1a5c2a;}
.btn-primary:hover{box-shadow:0 2px 0 #1a5c2a,0 4px 10px rgba(70,180,76,0.35);}
.btn-secondary{background:#3a3a3c;color:#ccc;outline:1px solid rgba(255,255,255,0.15);}
.btn-secondary:hover{background:#484849;color:#fff;}
.btn:disabled{opacity:0.35;cursor:not-allowed;background:#3f3f41!important;color:#666!important;box-shadow:none!important;}
.step-row{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.35);border-radius:2px;padding:10px 12px;margin-bottom:3px;}
.step-row.clickable{cursor:pointer;transition:background 0.15s;}
.step-row.clickable:hover{background:rgba(0,0,0,0.55);}
.step-row.sel-test{background:#e69348;}
.step-row.sel-test .step-name{color:#1a1a1c;}
.step-row.sel-test .step-status{color:#1a1a1c;}
.step-name{font-size:14px;color:#fff;}
.step-status{font-size:13px;font-weight:bold;}
.step-status.ok{color:#5fda55;}
.step-status.no{color:#e55;}
.step-status.na{color:#888;}
.question-text{font-size:14px;color:#ccc;line-height:1.6;margin-bottom:12px;padding:10px 0;}
.answer-row{display:flex;align-items:center;background:rgba(0,0,0,0.35);border-radius:2px;padding:10px 12px;margin-bottom:3px;cursor:pointer;transition:background 0.15s;font-size:14px;}
.answer-row:hover{background:#444;}
.answer-row.selected{background:#e69348;color:#1a1a1c;}
.progress-bar-wrap{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-bottom:14px;}
.progress-bar{height:4px;background:#e69348;border-radius:2px;transition:width 0.3s;}
.result-msg{text-align:center;padding:20px 0;font-size:15px;line-height:1.8;}
.result-msg.ok{color:#5fda55;}
.result-msg.fail{color:#e55;}
.subtitle{font-size:12px;color:#888;margin-bottom:10px;}
</style>
</head>
<body>

<div class="dialog active" id="dlg-main">
  <div class="dialog-header" id="hdr-main"><div class="dialog-title">Военный билет</div></div>
  <div class="dialog-content">
    <div class="subtitle" id="main-subtitle">Выполните все пункты для получения билета</div>
    <div id="steps-list"></div>
  </div>
  <div class="dialog-buttons">
    <button class="btn btn-primary" id="btn-start" disabled>Начать тест</button>
    <button class="btn btn-secondary" id="btn-close-main">Закрыть</button>
  </div>
</div>

<div class="dialog" id="dlg-test">
  <div class="dialog-header" id="hdr-test"><div class="dialog-title" id="test-title">Тест</div></div>
  <div class="dialog-content">
    <div class="progress-bar-wrap"><div class="progress-bar" id="test-progress" style="width:0%"></div></div>
    <div class="question-text" id="test-question"></div>
    <div id="test-answers"></div>
    <div class="result-msg" id="test-result" style="display:none"></div>
  </div>
  <div class="dialog-buttons">
    <button class="btn btn-primary" id="btn-answer" disabled>Ответить</button>
    <button class="btn btn-secondary" id="btn-test-back">Назад</button>
  </div>
</div>

<script>
// Псих тест — 10 вопросов, перемешанные
const PSYCH_Q_ALL=[
  {q:"Что такое ДМ (Deathmatch)?",a:["Убийство игрока без RP-причины","Использование внеигровой информации","Принуждение игрока к действиям"],c:0},
  {q:"Что такое МГ (Metagaming)?",a:["Убийство без причины","Использование информации полученной вне игры","Нарушение правил чата"],c:1},
  {q:"Что такое ПГ (Powergaming)?",a:["Принуждение игрока к действиям без его согласия","Убийство без причины","Игнорирование правил сервера"],c:0},
  {q:"Убьёте ли вы человека без RP-причины?",a:["Да","Нет","Зависит от ситуации"],c:1},
  {q:"Вам прикажут прыгнуть с крыши. Вы сделаете это?",a:["Да","Нет","Только если разрешат"],c:1},
  {q:"Можно ли стрелять в игрока просто потому что он вам не нравится?",a:["Да, если я сильнее","Нет, нужна RP-причина","Можно если никто не видит"],c:1},
  {q:"Вы стали свидетелем нарушения правил. Ваши действия?",a:["Участвую в нарушении","Сообщу администратору","Игнорирую"],c:1},
  {q:"Что значит РП (RolePlay)?",a:["Произвольная перестрелка","Отыгрывание роли согласно правилам","Спам в чате"],c:1},
  {q:"Можно ли использовать информацию из OOC в IC?",a:["Да","Нет, это метагейминг","Только если выгодно"],c:1},
  {q:"Как правильно поступить при аресте вашего персонажа?",a:["Убежать любой ценой","Отыграть ситуацию согласно RP","Выйти с сервера"],c:1}
];

// Тест устава — 9 вопросов (без 6го — спать на посту)
const USTAV_Q=[
  {q:"Можно ли просить проверить рапорт?",a:["Да","Нет"],c:1},
  {q:"Можно ли разговаривать в строю?",a:["Да","Нет"],c:1},
  {q:"Можно ли встать в строй при опоздании без разрешения командира?",a:["Да","Нет"],c:1},
  {q:"Можно ли покидать военную часть без разрешения?",a:["Да","Нет"],c:1},
  {q:"Можно ли общаться на 'ты' со старшим по званию?",a:["Нет, только если он товарищ","Да, всегда","Только в неформальной обстановке"],c:0},
  {q:"Можно ли спать вне расположения без разрешения?",a:["Да","Нет"],c:1},
  {q:"Обязан ли солдат докладывать о нарушениях дисциплины?",a:["Да","Нет"],c:1},
  {q:"Можно ли использовать личное оружие на территории части без причины?",a:["Да","Нет, только по причине"],c:1},
  {q:"Обязан ли солдат выполнять приказы командира?",a:["Да","Нет"],c:0}
];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const st={
  psych:0,ustav:0,parachute:1,postCount:0,postNeeded:2,days:0,daysNeeded:3,issued:0,
  testType:0,testQ:0,testSel:-1,testQuestions:[],selectedTestType:0
};

function emit(ev,data){if(typeof cef!=='undefined')cef.emit(ev,String(data||'1'));}

function showDlg(id){
  document.querySelectorAll('.dialog').forEach(d=>d.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderMain(){
  const steps=[
    {label:'1. Психологический тест',done:st.psych,type:1},
    {label:'2. Тест устава',done:st.ustav,type:2,locked:!st.psych},
    {label:'3. Прыжки с парашютом (3 раза)',done:st.parachute,type:0},
    {label:`4. Посты (${st.postCount}/${st.postNeeded})`,done:st.postCount>=st.postNeeded,type:0},
    {label:`5. Дней в организации (${st.days}/${st.daysNeeded})`,done:st.days>=st.daysNeeded,type:0}
  ];
  const list=document.getElementById('steps-list');
  list.innerHTML='';
  st.selectedTestType=0;
  steps.forEach(s=>{
    const row=document.createElement('div');
    const canClick=s.type>0&&!s.done&&!s.locked;
    row.className='step-row'+(canClick?' clickable':'');
    const statusText=s.done?'Выполнено':s.locked?'Сначала псих. тест':s.type===0?'Не выполнено':'Нажмите для выбора';
    const statusClass=s.done?'ok':s.locked?'na':s.type===0?'no':'na';
    row.innerHTML=`<span class="step-name">${s.label}</span><span class="step-status ${statusClass}">${statusText}</span>`;
    if(canClick){
      row.onclick=()=>{
        list.querySelectorAll('.step-row').forEach(r=>r.classList.remove('sel-test'));
        row.classList.add('sel-test');
        st.selectedTestType=s.type;
        document.getElementById('btn-start').disabled=false;
      };
    }
    list.appendChild(row);
  });
  const allDone=st.psych&&st.ustav&&st.parachute&&st.postCount>=st.postNeeded&&st.days>=st.daysNeeded;
  const sub=document.getElementById('main-subtitle');
  if(st.issued){sub.textContent='Военный билет выдан!';sub.style.color='#5fda55';}
  else if(allDone){sub.textContent='Все пункты выполнены.';}
  else sub.textContent='Выберите тест для прохождения.';
  document.getElementById('btn-start').disabled=true;
}

document.getElementById('btn-start').onclick=()=>{
  if(!st.selectedTestType) return;
  startTest(st.selectedTestType);
};
document.getElementById('btn-close-main').onclick=()=>emit('vb:close');

function startTest(type){
  st.testType=type;
  st.testQ=0;
  st.testSel=-1;
  if(type===1) st.testQuestions=shuffle(PSYCH_Q_ALL);
  else st.testQuestions=shuffle(USTAV_Q);
  document.getElementById('test-title').textContent=type===1?'Психологический тест':'Тест устава';
  document.getElementById('test-result').style.display='none';
  document.getElementById('btn-answer').style.display='';
  document.getElementById('btn-answer').disabled=true;
  showDlg('dlg-test');
  renderQuestion();
}

function renderQuestion(){
  const qs=st.testQuestions;
  if(st.testQ>=qs.length){testDone(true);return;}
  const q=qs[st.testQ];
  const total=qs.length;
  document.getElementById('test-progress').style.width=((st.testQ/total)*100)+'%';
  document.getElementById('test-question').textContent=(st.testQ+1)+' / '+total+'. '+q.q;
  const ans=document.getElementById('test-answers');
  ans.innerHTML='';
  st.testSel=-1;
  document.getElementById('btn-answer').disabled=true;
  // перемешиваем ответы вместе с индексом правильного
  const idxMap=q.a.map((_,i)=>i);
  const shuffled=[...idxMap];
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  const newCorrect=shuffled.indexOf(q.c);
  shuffled.forEach((origIdx,i)=>{
    const row=document.createElement('div');
    row.className='answer-row';
    row.textContent=q.a[origIdx];
    row.onclick=()=>{
      ans.querySelectorAll('.answer-row').forEach(r=>r.classList.remove('selected'));
      row.classList.add('selected');
      st.testSel=i;
      document.getElementById('btn-answer').disabled=false;
    };
    ans.appendChild(row);
  });
  st._currentCorrect=newCorrect;
}

document.getElementById('btn-answer').onclick=()=>{
  if(st.testSel===-1) return;
  if(st.testSel!==st._currentCorrect){testDone(false);return;}
  st.testQ++;
  renderQuestion();
};

function testDone(success){
  document.getElementById('test-progress').style.width='100%';
  document.getElementById('test-question').textContent='';
  document.getElementById('test-answers').innerHTML='';
  document.getElementById('btn-answer').style.display='none';
  const res=document.getElementById('test-result');
  res.style.display='block';
  if(success){
    res.className='result-msg ok';
    res.textContent='Тест пройден успешно!';
    emit('vb:test_done',st.testType);
    if(st.testType===1) st.psych=1;
    else st.ustav=1;
    setTimeout(()=>{showDlg('dlg-main');renderMain();},1500);
  } else {
    res.className='result-msg fail';
    res.innerHTML='Неверный ответ.<br>Тест провален. Попробуйте снова.';
    emit('vb:test_fail',st.testType);
  }
}

document.getElementById('btn-test-back').onclick=()=>{showDlg('dlg-main');renderMain();};

['hdr-main','hdr-test'].forEach(hid=>{
  const h=document.getElementById(hid);
  if(!h) return;
  const dlg=h.closest('.dialog');
  let drag=false,ox=0,oy=0;
  h.onmousedown=e=>{drag=true;const r=dlg.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;};
  document.addEventListener('mousemove',e=>{if(!drag)return;dlg.style.transform='translate(0,0)';dlg.style.left=(e.clientX-ox)+'px';dlg.style.top=(e.clientY-oy)+'px';});
  document.addEventListener('mouseup',()=>drag=false);
});

window.addEventListener('keydown',e=>{if(e.key==='Escape')emit('vb:close');});

if(typeof cef!=='undefined'){
  cef.on('vb:open',json=>{
    try{
      const d=JSON.parse(json);
      st.psych=d.psych||0;st.ustav=d.ustav||0;st.parachute=d.parachute||0;
      st.postCount=d.postCount||0;st.days=d.days||0;st.issued=d.issued||0;
    }catch(e){}
    renderMain();
    if(typeof cef!=='undefined') cef.emit('game:showCursor','1');
  });
}

window.onload=()=>{
  if(typeof cef!=='undefined') cef.emit('vb:ready','1');
  else{st.psych=0;st.ustav=0;st.parachute=1;st.postCount=1;st.days=1;renderMain();}
};
</script>
</body>
</html>
