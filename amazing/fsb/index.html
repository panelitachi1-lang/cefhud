<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удостоверение ФСБ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: transparent;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .certificate {
            position: relative;
            width: 800px;
            height: 560px;
            background-image: url('fsb.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .player-data {
            position: absolute;
            right: 200px;
            top: 245px;
            font-family: 'Courier New', 'Times New Roman', monospace;
            font-size: 15px;
            font-weight: bold;
            color: black;
            background: transparent;
            line-height: 1.6;
            text-align: right;
        }
        .player-data div {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="certificate">
    <div class="player-data">
        <div>РАНГ: <span id="playerRank">СОТРУДНИК</span></div>
        <div>НИК: <span id="playerNick">UNKNOWN</span></div>
    </div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('nick')) {
        document.getElementById('playerNick').innerText = decodeURIComponent(urlParams.get('nick'));
    }
</script>
</body>
</html>
